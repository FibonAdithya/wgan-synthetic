# Variant v2 -- v1_5 plus the gated non-negative generator, which
# reproduces SIFT's exact-zero support that a dense MLP cannot. Sole delta
# from v1_5: model.generator_type and its two gate hyperparameters.
# Matches runs/x100k_sparse_clamp4's settings at 30k steps; that run itself
# used num_gen_steps: 100000 and log_every/eval_every/save_every: 500/2000/5000.
seed: 42
device: auto
output_dir: runs/sift/v2

data:
  real_path: data/sift_base.npy
  format: npy
  metric: l2
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: gated
  gate_temperature: 0.5
  logit_clamp: 4.0

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  ema_decay: 0.999
  distance_reg_alpha: 0.1
  distance_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
