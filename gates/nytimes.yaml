# Gate bands for the nytimes family -- the machine-readable form of the
# `## Gate` section in docs/datasets/nytimes.md. Checked by:
#
#     python -m src.eval.check_gate --dataset nytimes --run-dir <run_dir>
#
# Pass bands are per statistic, not a combined score, because the four fail in
# different directions: a set can be too easy on contrast while being too
# clustered on Gini, and one number would hide that.
#
# EVERY BAND BELOW IS UNSET (null). Bands are set once this family has a
# trained ladder to show what is achievable; inventing numbers before that
# would gate against a guess. While they are null, `check_gate` reports each
# statistic as "unset" and exits non-zero with verdict "unset" -- an
# unenforceable gate must not be mistaken for a passing one. Pass
# `--allow-unset` to run the checker for its report alone.
#
# To set a band, replace min and/or max with numbers. A band with one bound is
# legal and counts as set: several of these statistics only fail in one
# direction. Bounds are inclusive.

dataset: nytimes

# Locked measurement conditions. A statistic measured under different
# conditions is not comparable with one measured under these -- LID, contrast
# and hubness all drift with sample count and with k -- so `check_gate`
# compares these against the post-clamp actuals recorded in summary.json
# (`ann_measured_rows`, `ann_measured_k`, `ann_measured_nlist`) and fails on a
# mismatch. These match the eda_report defaults and docs/datasets/nytimes.md.
#
# k_hub is recorded for completeness only: eda_report does not write a
# post-clamp actual for the hubness depth, so there is nothing to check it
# against.
canonical:
  n: 20000
  k: 100
  k_hub: 10
  nlist: 256

# Named exactly as `src/eval/ann_difficulty.py::summary()` returns them, which
# is how they reach `stats` in summary.json.
statistics:
  # Local intrinsic dimensionality, median over surviving queries. Too low
  # means the synthetic set is easier to search than the real one.
  lid_median:
    min: null
    max: null

  # Median (mean distance / nearest distance). Collapses toward 1.0 when
  # neighbours stop being distinguishable from the bulk.
  relative_contrast_median:
    min: null
    max: null

  # Skew of the k-occurrence distribution. High skew means a few hub vectors
  # dominate neighbour lists, which is a real property of nytimes and not
  # something a generator gets for free.
  #
  # Careful with this one, and with lid_median and ivf_gini. At the locked
  # conditions the real corpus scores hubness skew 28.8 to 40.8, LID 13.9 to
  # 22.1 and Gini 0.80 to 0.98 across ten disjoint draws, and every one of
  # those numbers is set by the 12 to 24 exact-zero rows that land in each
  # draw: a zero row sits at L2 exactly 1.0 from every unit-norm row, closer
  # than most rows' fifth real neighbour, so ten of them collect 61% of all
  # k-occurrence. With zero rows and exact duplicates dropped the same draws
  # score 2.3 to 2.8, 55.0 to 56.9 and 0.78 to 0.82. A band set against the
  # as-shipped numbers would gate on how many zero rows a draw got. Whether
  # the row filter becomes part of these locked conditions is a human
  # decision; see "What needs a human" in docs/datasets/nytimes.md and
  # docs/datasets/nytimes_noise_floor.json.
  hubness_skew:
    min: null
    max: null

  # Gini of IVF cell occupancy at nlist above. 0.0 is a perfectly even
  # partition; a lopsided one drives how many cells a query must probe.
  ivf_gini:
    min: null
    max: null
