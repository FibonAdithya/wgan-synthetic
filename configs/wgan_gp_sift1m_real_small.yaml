seed: 42
device: auto
output_dir: runs/wgan_sift1m_real_small

data:
  real_path: data/sift_base.fvecs
  format: fvecs
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 64
  generator_hidden_dims: [128, 256, 256]
  critic_hidden_dims: [256, 256, 128]
  negative_slope: 0.2

training:
  batch_size: 512
  num_gen_steps: 1500
  n_critic: 5
  lr_g: 1.0e-4
  lr_d: 2.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 10.0
  amp: false
  log_every: 50
  eval_every: 250
  save_every: 250
