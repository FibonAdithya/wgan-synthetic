# v0 at 100k steps, on sift_1m. The length-matched dense baseline.
#
# WHY THIS RUN EXISTS. The 2026-08-13 v0 100k run on branch `benchmark-algos`
# (docs/results/sift-v0-v1-v4/) wrote its checkpoints to /workspace/keep, which
# the 2026-09-16 box rebuild wiped. The committed summary.json survives, so the
# numbers are still readable, but the samples are gone and no distribution
# figure can be drawn from them. This is the same config, retrained, for the
# same reason configs/sift/v4_sift1m_x100k.yaml was retrained.
#
# PROVENANCE. That report states the v0 arm was "v1's own config with
# `ema_decay` removed and nothing else changed", so this file is
# configs/sift/v1.yaml with:
#
#   1. ema_decay              0.999 -> removed   (this is the v0/v1 delta)
#   2. real_path    data/sift_base.npy -> /workspace/data-cache/sift_1m.npy
#   3. output_dir     runs/sift_gan_v1 -> runs/sift/v0_sift1m_x100k
#   4. device                   auto -> cuda:0
#   5. num_gen_steps           30000 -> 100000
#   6. log_every                 250 -> 500
#   7. eval_every               1000 -> 2000
#   8. save_every               2000 -> 5000
#
# Items 4-8 match configs/sift/v4_sift1m_x100k.yaml exactly, so v0 and v4 are
# comparable at matched length and cadence. data/sift_base.npy no longer
# exists on the box; sift_1m.npy was shown on 2026-08-10 to hold the same data,
# and v4_sift1m_x100k.yaml already reads it.
#
# It is an instrument, not a rung: the absolute corpus path is box-specific by
# construction. The v0 rung is configs/sift/v0.yaml.
#
# The original run took 112 min on an RTX 4060.
seed: 42
device: cuda:0
output_dir: runs/sift/v0_sift1m_x100k

data:
  real_path: /workspace/data-cache/sift_1m.npy
  format: npy
  metric: l2
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2

training:
  batch_size: 512
  num_gen_steps: 100000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 128
  num_workers: 0
  amp: false
  log_every: 500
  eval_every: 2000
  save_every: 5000
