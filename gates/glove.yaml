# Gate bands for the glove family -- the machine-readable form of the
# `## Gate` section in docs/datasets/glove.md. Checked by:
#
#     python -m src.eval.check_gate --dataset glove --run-dir <run_dir>
#
# Pass bands are per statistic, not a combined score, because the four fail in
# different directions: a set can be too easy on contrast while being too
# clustered on Gini, and one number would hide that.
#
# ALL FOUR BANDS ARE SET, set 2026-09-17 after the v1 five-seed sweep.
#
# These bands mean something different from gates/deep.yaml's. DEEP's are a
# regression guard around what its ladder reaches, and real DEEP fails them.
# These are a TOLERANCE AROUND REAL: each is centred on the mean of eight
# 20000-row draws of the real corpus (docs/datasets/glove_noise_floor.json),
# and says how far from real still counts as close enough. Real passes, as it
# should.
#
# The tolerances are a human judgement, made after seeing v1's results
# (docs/datasets/glove_v1_noise_floor.json), not derived from a noise floor.
# The real-side floor alone is far too narrow to admit any trained rung on LID
# and contrast (ranges of 0.5% and 0.3% of the mean), so a band built from it
# would gate against a standard no generator here meets. Every bound is
# rounded outward to four decimals. Checked against the committed per-seed
# JSONs by tests/test_check_gate.py: all eight real draws and all five v1
# seeds pass every band, and every v0 seed, on both boxes, fails every band.
#
# While any band is null, `check_gate` exits 2 with verdict "unset". Pass
# `--allow-unset` to run the checker for its report alone.
#
# To set a band, replace min and/or max with numbers. A band with one bound is
# legal and counts as set: several of these statistics only fail in one
# direction. Bounds are inclusive.

dataset: glove

# Locked measurement conditions. A statistic measured under different
# conditions is not comparable with one measured under these -- LID, contrast
# and hubness all drift with sample count and with k -- so `check_gate`
# compares these against the post-clamp actuals recorded in summary.json
# (`ann_measured_rows`, `ann_measured_k`, `ann_measured_nlist`) and fails on a
# mismatch. These match the eda_report defaults and docs/datasets/glove.md.
#
# k_hub is recorded for completeness only: eda_report does not write a
# post-clamp actual for the hubness depth, so there is nothing to check it
# against.
canonical:
  n: 20000
  k: 100
  k_hub: 10
  nlist: 256

# Named exactly as `src/eval/ann_difficulty.py::summary()` returns them, which
# is how they reach `stats` in summary.json.
statistics:
  # Local intrinsic dimensionality, median over surviving queries. Too low
  # means the synthetic set is easier to search than the real one.
  #
  # Band = real mean 35.1238 +/- 10%. v1's five seeds span 36.08 to 38.62, so
  # its highest seed sits 0.011 inside the upper bound: the 10% was chosen with
  # that in view. v0 spans 15.70 to 22.00 across both boxes.
  lid_median:
    min: 31.6113
    max: 38.6362

  # Median (mean distance / nearest distance). Collapses toward 1.0 when
  # neighbours stop being distinguishable from the bulk.
  #
  # Band = real mean 1.3895 +/- 2.5%. v1 spans 1.3572 to 1.3744, all below
  # real (harder to search); v0 spans 1.6393 to 1.8958.
  relative_contrast_median:
    min: 1.3547
    max: 1.4243

  # Skew of the k-occurrence distribution. High skew means a few hub vectors
  # dominate neighbour lists, which is a real property of glove and not
  # something a generator gets for free.
  #
  # Careful with this one. Eight 20000-row draws of the *real* corpus scored
  # 3.46 to 8.33 -- a spread of 108% of the mean, against 0.5% for lid_median
  # -- because the skew is a third moment set by a handful of tail hubs. That
  # makes a band on it coarse, not useless: it was once claimed here that any
  # band admitting that range would pass nearly any generator, but a v0
  # five-seed sweep scored 1.535 to 1.798, entirely clear of 3.46--8.33, so
  # such a band would reject v0 decisively. A band this wide can only catch a
  # generator whose hubness deficit exceeds the real corpus's own noise floor
  # -- as v0's does -- and would go blind again against a later rung that
  # closed most of the gap and landed inside 3.46--8.33, indistinguishable
  # there from a reseed of real itself.
  # See the "Hubness skew is below the noise floor at this N" and
  # "Noise floor" sections of docs/datasets/glove.md, and
  # docs/datasets/glove_noise_floor.json / docs/datasets/glove_v0_noise_floor.json.
  #
  # Band = the real eight-draw range itself, 3.4630 to 8.3308, rounded out. No
  # tolerance is added: the range is already wide. v1 spans 3.95 to 4.64; v0
  # spans 1.54 to 2.36. The lower bound is the lowest of only eight draws, so
  # an unlucky real draw could land just under it.
  hubness_skew:
    min: 3.4630
    max: 8.3309

  # Gini of IVF cell occupancy at nlist above. 0.0 is a perfectly even
  # partition; a lopsided one drives how many cells a query must probe.
  #
  # Band = real mean 0.5932 +/- 10%. v1's seed spread (0.5690 to 0.6289) is
  # wider than the real range (0.5816 to 0.6034), so a band on the real range
  # would reject three of v1's five seeds on noise. v0 spans 0.2367 to 0.3369.
  ivf_gini:
    min: 0.5339
    max: 0.6526
