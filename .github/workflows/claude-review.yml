name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

# A second push supersedes the review of the first; don't pay for both.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Bills the Claude subscription rather than an API account. The
          # token comes from `claude setup-token`; swap this for
          # `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` to pay per
          # token instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_AUTH_TOKEN }}
          # Without this the action mints its own token through the Claude
          # GitHub App, which is not installed here. The job's own token has
          # the pull-requests: write it needs; comments arrive from
          # github-actions[bot] rather than from Claude.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the working directory. Read AGENTS.md first -- it is the project's
            router, and its "Five invariants" section lists the mistakes that
            nothing in the test suite catches.

            Prioritise, in order:
            - Violations of the five invariants in AGENTS.md. In particular:
              a change that alters what a variant number means, that treats a
              diagnostic metric (MMD, cov_fro, pairwise_hist_l1) as the gate
              instead of the four ANN-difficulty statistics, that compares
              variant numbers or measured statistics across families, or that
              separates a checkpoint from its run_config.yaml.
            - Correctness bugs: wrong maths in metrics or the training
              objective, silent shape/dtype errors, seeding and reproducibility
              breaks, off-by-one in neighbour or sampling code.
            - Docs that now contradict the code. The code and configs win;
              PROJECT_DOCUMENTATION.md is next. Flag stale claims rather than
              rewriting them.
            - Missing test coverage for new behaviour.

            Do not flag style that `make check` (ruff lint + format) already
            enforces, and do not propose tightening gate bands, repointing a
            config's data path, or bumping a pinned requirement -- AGENTS.md
            reserves those for a human.

            Be concise and specific. If the diff is clean, say so in one short
            comment rather than manufacturing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines.
            Only post GitHub comments -- don't return review text as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
