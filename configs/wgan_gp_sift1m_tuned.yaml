seed: 42
device: auto
output_dir: runs/wgan_sift1m_tuned

data:
  real_path: null
  format: auto
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: true
  synthetic_num_vectors: 200000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2

training:
  batch_size: 512
  num_gen_steps: 1500
  n_critic: 5
  lr_g: 1.0e-4
  lr_d: 2.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 10.0
  amp: false
  log_every: 50
  eval_every: 250
  save_every: 250
