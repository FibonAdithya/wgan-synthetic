# Gate bands for the sift family -- the machine-readable form of the
# `## Gate` section in docs/datasets/sift.md. Checked by:
#
#     python -m src.eval.check_gate --dataset sift --run-dir <run_dir>
#
# Pass bands are per statistic, not a combined score, because the four fail in
# different directions: a set can be too easy on contrast while being too
# clustered on Gini, and one number would hide that.
#
# ALL FOUR BANDS ARE SET, set 2026-09-17 after v4 was retrained at 100k.
#
# Like gates/glove.yaml and gates/nytimes.yaml, and unlike gates/deep.yaml,
# these are a TOLERANCE AROUND REAL: each is centred on the mean of ten
# disjoint 20000-row draws of sift_1m.npy (docs/datasets/sift_noise_floor.json,
# made by scripts/sift_real_noise_floor.py), and says how far from real still
# counts as close enough. Real passes, as it should.
#
# The tolerances are a human judgement, made after seeing the v4 retrain
# (docs/results/sift-v4-x100k-retrain/): the owner chose to admit v4 at 100k
# rather than hold SIFT to NYTimes' +/-5%, which v4 misses on LID and hubness.
# They rest on one training seed, reproduced once: the 2026-08-10 run and the
# retrain agree to within 0.6 points of the mean on every statistic. Every
# bound is rounded outward to four decimals. Checked by tests/test_check_gate.py:
# all ten real draws and every committed canonical real row pass; the verdict
# over every committed SIFT summary passes the three v4 100k entries and
# nothing else; and each band on its own rejects at least one other rung.
#
# If a band is ever set back to null, `check_gate` exits 2 with verdict
# "unset"; `--allow-unset` runs the checker for its report alone.
#
# To set a band, replace min and/or max with numbers. A band with one bound is
# legal and counts as set: several of these statistics only fail in one
# direction. Bounds are inclusive.

dataset: sift

# Locked measurement conditions. A statistic measured under different
# conditions is not comparable with one measured under these -- LID, contrast
# and hubness all drift with sample count and with k -- so `check_gate`
# compares these against the post-clamp actuals recorded in summary.json
# (`ann_measured_rows`, `ann_measured_k`, `ann_measured_nlist`) and fails on a
# mismatch. These match the eda_report defaults and docs/datasets/sift.md.
#
# k_hub is recorded for completeness only: eda_report does not write a
# post-clamp actual for the hubness depth, so there is nothing to check it
# against.
canonical:
  n: 20000
  k: 100
  k_hub: 10
  nlist: 256

# Named exactly as `src/eval/ann_difficulty.py::summary()` returns them, which
# is how they reach `stats` in summary.json.
statistics:
  # Local intrinsic dimensionality, median over surviving queries. Too low
  # means the synthetic set is easier to search than the real one.
  #
  # Band = real mean 17.6911 -9% / +5%, asymmetric because every rung on this
  # ladder sits below real. v4_best reads 16.4147 (-7.2%), 0.316 above the
  # lower bound. The dense rungs are close to real here (v1 17.45, v1_5 17.46,
  # both 100k); v2 at 100k (14.79) and v3 (13.33) fail.
  lid_median:
    min: 16.0988
    max: 18.5757

  # Median (mean distance / nearest distance). Collapses toward 1.0 when
  # neighbours stop being distinguishable from the bulk.
  #
  # Band = real mean 2.2599 +/- 5%. v4_best reads 2.3231 (+2.8%). v2 at 100k
  # (2.5122) and v3 (2.6795) fail.
  relative_contrast_median:
    min: 2.1469
    max: 2.3730

  # Skew of the k-occurrence distribution. High skew means a few hub vectors
  # dominate neighbour lists, which is a real property of sift and not
  # something a generator gets for free.
  #
  # Band = real mean 1.9026 +/- 8%. The ten real draws span 7.2% of the mean
  # (1.8284 to 1.9652), so a tighter band would start failing real. v4_best
  # reads 1.7937 (-5.7%) and v4's step 100,000 1.7641 (-7.3%). The dense rungs
  # overshoot and fail: v1 2.0958 (+10.2%), v1_5 2.1541 (+13.2%), v0 at 30k too.
  hubness_skew:
    min: 1.7503
    max: 2.0549

  # Gini of IVF cell occupancy at nlist above. 0.0 is a perfectly even
  # partition; a lopsided one drives how many cells a query must probe.
  #
  # Band = real mean 0.3039 +/- 8%. The ten real draws span 10.4% of the mean
  # (0.2866 to 0.3180), wider than any rung's distance from real, so this band
  # separates little: v4_best reads 0.2987 (-1.7%). v1_5 at 100k (0.3287,
  # +8.1%) fails it by 0.0004.
  ivf_gini:
    min: 0.2796
    max: 0.3283
