# Variant v3 at 100k steps: v2's gated generator with structured support statistics.
# Exactly one change from configs/sift_gan_v2.yaml -- generator_type -- plus
# the three keys that change introduces. v2's gates are independent per
# coordinate, so its non-zero count is Binomial(128, p) with std about 4.76;
# real SIFT measures 14.45. See
# docs/superpowers/specs/2026-08-03-structured-gate-generator-design.md
#
# v3 at 100k steps -- the arm the experiment plan actually calls for. The
# variant definition is configs/sift_gan_v3.yaml, at 30k like every other
# sift_gan_* config. Sole delta from it: run length and logging cadence.
seed: 42
device: cuda:0
output_dir: runs/x100k_structured

data:
  real_path: data/sift_base.npy
  format: npy
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: structured_gated
  gate_temperature: 0.5
  logit_clamp: 4.0
  layout: [4, 4, 8]
  gate_kernel: 3
  # Calibrated against the measured residual zero-correlation profile rather
  # than guessed: at 0.65 the sampled gate reproduces +0.329 at separation 1
  # and +0.271 at offset 8, against the real +0.317 and +0.275. The original
  # 0.8 overshot both by ~30%. The kernel is deliberately not learnable, so
  # training cannot walk this back on its own.
  noise_kernel_sigma: 0.65

training:
  batch_size: 512
  num_gen_steps: 100000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  ema_decay: 0.999
  distance_reg_alpha: 0.1
  distance_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 500
  eval_every: 2000
  save_every: 5000
