# Variant v4: v3 plus the local log-ratio regularizer.
# Exactly one change from configs/sift/v3.yaml -- lid_reg_alpha off the
# floor -- plus the two keys that change parameterises. v3 bets that the
# structured gate reaches SIFT's local geometry unaided; v4 hedges it by
# matching the mean log-ratio profile of within-batch neighbours, the
# sufficient statistic the Hill LID estimator reduces to a scalar. See
# docs/superpowers/specs/2026-08-03-structured-gate-generator-design.md
#
# v3 and v4 are NOT judged the same way. v4 trains on LID's sufficient
# statistic, so its lid_median is a fitted number, not evidence. The real
# question is what comes with it -- hubness_skew, ivf_gini and
# relative_contrast are untouched by this penalty and stay independent. Any
# write-up of a v4 result must lead with those, not with LID.
seed: 42
device: cuda:0
output_dir: runs/sift_gan_v4

data:
  real_path: data/sift_base.npy
  format: npy
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: structured_gated
  gate_temperature: 0.5
  logit_clamp: 4.0
  layout: [4, 4, 8]
  gate_kernel: 3
  noise_kernel_sigma: 0.65

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  ema_decay: 0.999
  distance_reg_alpha: 0.1
  distance_reg_max_points: 256
  # NOT chosen by analogy to distance_reg_alpha: that penalty is a single
  # scalar, while log_ratio_penalty is an L1 *sum* over lid_reg_k - 1 terms
  # and so sits on a different scale entirely. Measured at this k on real
  # SIFT batches (tools/probes/lid_reg_scale_probe.py):
  #
  #   real vs real (noise floor) : 0.126 +/- 0.080
  #   untrained v3 vs real       : 0.994 +/- 0.018   -> 7.9x the floor
  #
  # For scale, distance_reg's proven setting contributes 0.1 * 0.0074 =
  # 0.0007 to the generator loss in x100k_improved, i.e. 0.5% of that run's
  # |adv_loss| = 0.155. The plan's suggested 0.1 would put lid_reg at 0.099
  # at initialisation -- 64% of the same adv_loss, and still 8% once the gap
  # decays to the floor. That is a different objective, not a regularizer.
  #
  # 0.015 contributes ~2.5% of |adv_loss| at initialisation and ~1.2% at the
  # floor: a few times firmer than distance_reg's nudge, which suits the
  # primary mechanism of the arm, without displacing the adversarial signal.
  lid_reg_alpha: 0.015
  lid_reg_k: 20
  lid_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
