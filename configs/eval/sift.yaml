# Which trained variants `src.eval.compare_variants` (and
# `src.eval.plot_descriptor_grid`) overlay, and where their artifacts live.
#
# This file exists so the comparison is not hard-coded against one machine's
# history. `runs/` is gitignored, so the directories named below are present
# only on a box that trained them; a fresh clone must either copy those runs
# in, or edit this manifest (or pass `--variants-manifest`) to name runs it
# actually has.
#
# Order is meaningful: the report legend reads as a progression, and each
# entry is one config delta from the previous -- EMA, then the distance
# regularizer, then the gated generator -- so a difference visible in the
# report attributes to a single cause.
#
# `run_dir` is the longest run of each variant that exists on the training
# box, which is why these names do not match the `output_dir` in the configs
# beside them; v0 was never taken to 100k steps. Retraining a variant from
# its config writes to that config's `output_dir`, so a fresh training run
# needs `run_dir` here repointed at it.
#
# Fields per entry:
#   name       report label, sample filename stem; must be unique
#   config     the config the variant is defined by, relative to --root
#   run_dir    directory holding best_generator.pt and run_config.yaml,
#              relative to --root
variants:
  - name: v0
    config: configs/sift/v0.yaml
    run_dir: runs/long_baseline
  - name: v1
    config: configs/sift/v1.yaml
    run_dir: runs/x100k_ema_only
  - name: v1_5
    config: configs/sift/v1_5.yaml
    run_dir: runs/x100k_improved
  - name: v2
    config: configs/sift/v2.yaml
    run_dir: runs/x100k_sparse_clamp4
  - name: v3
    config: configs/sift/v3.yaml
    run_dir: runs/sift_gan_v3
  - name: v4
    config: configs/sift/v4.yaml
    run_dir: runs/x100k_structured
