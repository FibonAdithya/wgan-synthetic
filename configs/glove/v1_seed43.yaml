# GloVe v1 seed sweep, run 43: v0_seed43 plus the covariance-spectrum
# regularizer, which is v1's one delta (configs/glove/v1.yaml). A measurement
# instrument of the rung, not a rung.
#
# Provenance: trained at commit b17bd5f under the name probe_spectrum_seed43
# (output_dir runs/glove/probe_spectrum_seed43), before the probe was chosen
# as v1. Renamed afterwards for clarity; only the file name and output_dir
# changed. Run records and the committed sweep JSONs still use the old name.
#
# Deltas from configs/glove/v1.yaml: seed, output_dir, data.real_path (absolute,
# because gpuq runs each job in a fresh worktree without data/) and device
# (cuda:0, the card the runner pins through CUDA_VISIBLE_DEVICES).
# Deltas from v0_seed43: device, output_dir and spectrum_reg_alpha.
seed: 43
device: cuda:0
output_dir: runs/glove/v1_seed43

data:
  real_path: /workspace/data-cache/glove_250k.npy
  format: npy
  metric: angular
  descriptor_dim: 100
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  # 128 over a 100-dimensional corpus is deliberate. GloVe's measured
  # effective rank is 94.6 of 100, so there is no bottleneck to discover and a
  # latent at or below the corpus rank would impose one. configs/deep/v0.yaml
  # corrected the same sift-inherited 128 down to its descriptor_dim, but that
  # was driven by deep's effective rank of 65 of 96 and does not transfer.
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: mlp

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 256
  spectrum_reg_alpha: 5.0
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
