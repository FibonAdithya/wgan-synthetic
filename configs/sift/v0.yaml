# Variant v0 -- plain WGAN-GP. The baseline every other variant is one
# delta from. Matches runs/long_baseline; runs/bench_baseline is the same
# config at 3k steps; there is no x100k run of this variant.
seed: 42
device: auto
output_dir: runs/sift_gan_v0

data:
  real_path: data/sift_base.npy
  format: npy
  metric: l2
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 128
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
