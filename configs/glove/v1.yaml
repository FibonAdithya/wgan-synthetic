# GLOVE v1 -- v0 plus the covariance-spectrum regularizer. v0 learns GloVe's
# shared mean direction but spreads its variance over too few directions
# (participation ratio 50 against real 88), and the neighbourhood structure
# that makes GloVe hard to search collapses with it. spectrum_reg matches the
# normalized eigenvalue spectrum directly. Sole delta from v0:
# training.spectrum_reg_alpha.
#
# alpha 5.0 is the value DEEP's sweep found binding (docs/datasets/deep.md):
# 0.1 and 1.0 did not move effective_rank. It is not tuned for GloVe.
#
# Evidence: five seeds, configs/glove/v1_seed42.yaml through v1_seed46.yaml.
# See docs/datasets/glove.md for the measured results, including where v1
# still misses real.
seed: 42
device: auto
output_dir: runs/glove/v1

data:
  real_path: data/glove_250k.npy
  format: npy
  metric: angular
  descriptor_dim: 100
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: mlp

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 256
  spectrum_reg_alpha: 5.0
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
