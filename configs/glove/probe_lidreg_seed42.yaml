# GloVe probe: v0_seed42 plus the local log-ratio LID regularizer (lid_reg).
# A single-seed measurement instrument, not a ladder rung: promoting a probe to
# v1 is a human decision (AGENTS.md).
#
# Why this term: v0 learns GloVe's shared mean direction (mean unit vector norm
# 0.364 vs real 0.355) but collapses the spread around it -- participation
# ratio 50 vs 88, LID median 16 vs 35, nearest-neighbour cosine median 0.74 vs
# 0.55 -- and hubness falls with it (skew 1.64 vs 4.08). lid_reg is the one term
# in this repo with a result on hubness (SIFT v4). It trains on LID's sufficient
# statistic, so this probe's lid_median is fitted, not evidence: judge it on
# participation ratio, hubness, contrast and IVF Gini.
#
# Deltas from v0_seed42: device, output_dir, and the three lid_reg keys.
# device is cuda:0 (runner pins CUDA_VISIBLE_DEVICES to the claimed card) because
# tools/probes/lid_reg_scale_probe.py passes it straight to torch.device.
seed: 42
device: cuda:0
output_dir: runs/glove/probe_lidreg_seed42

data:
  real_path: /workspace/data-cache/glove_250k.npy
  format: npy
  metric: angular
  descriptor_dim: 100
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  # 128 over a 100-dimensional corpus is deliberate. GloVe's measured
  # effective rank is 94.6 of 100, so there is no bottleneck to discover and a
  # latent at or below the corpus rank would impose one. configs/deep/v0.yaml
  # corrected the same sift-inherited 128 down to its descriptor_dim, but that
  # was driven by deep's effective rank of 65 of 96 and does not transfer.
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: mlp

training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 256
  # PROVISIONAL: SIFT v4's value, to be replaced by the GloVe scale probe
  # (tools/probes/lid_reg_scale_probe.py) before this config is trained.
  lid_reg_alpha: 0.015
  lid_reg_k: 20
  lid_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
