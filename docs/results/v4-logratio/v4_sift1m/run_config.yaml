seed: 42
device: cuda:0
output_dir: runs/sift/v4_sift1m
data:
  real_path: /workspace/data-cache/sift_1m.npy
  format: npy
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true
model:
  latent_dim: 128
  generator_hidden_dims:
  - 512
  - 1024
  - 1024
  critic_hidden_dims:
  - 1024
  - 512
  - 256
  negative_slope: 0.2
  generator_type: structured_gated
  gate_temperature: 0.5
  logit_clamp: 4.0
  layout:
  - 4
  - 4
  - 8
  gate_kernel: 3
  noise_kernel_sigma: 0.65
training:
  batch_size: 512
  num_gen_steps: 30000
  n_critic: 3
  lr_g: 0.0001
  lr_d: 0.0001
  betas:
  - 0.0
  - 0.9
  lambda_gp: 5.0
  ema_decay: 0.999
  distance_reg_alpha: 0.1
  distance_reg_max_points: 256
  lid_reg_alpha: 0.015
  lid_reg_k: 20
  lid_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
