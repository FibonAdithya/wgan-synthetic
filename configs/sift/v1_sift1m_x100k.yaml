# v1 at 100k steps, on sift_1m. The missing arm of the v0/v1/v4 comparison.
#
# Exactly six keys differ from configs/sift/v1.yaml -- corpus, device, output
# location, run length and logging cadence. No model or optimisation change:
#
#   1. device               auto -> cuda:0
#   2. real_path   data/sift_base.npy -> /workspace/data-cache/sift_1m.npy
#   3. output_dir  runs/sift_gan_v1   -> runs/sift/v1_sift1m_x100k
#   4. num_gen_steps        30000 -> 100000
#   5. log_every              250 -> 500
#   6. eval_every / save_every 1000/2000 -> 2000/5000
#
# The cadence values match configs/sift/v4_sift1m_x100k.yaml, so the two 100k
# arms log at the same points.
#
# WHY THIS RUN EXISTS. docs/results/sift-v0-v1-v4/ compares v0, v1 and v4 at a
# matched 100k steps and reverses the earlier 30k headline. Two of its three
# arms were trained here on sift_1m; the third, v1, is `runs/x100k_ema_only`,
# an older checkpoint fit against data/sift_base.npy -- the corpus that is no
# longer on the box. So the one delta the report attributes to generator EMA,
# v0 -> v1, is confounded with a change of training corpus, while the v1 -> v4
# comparison is not. This run removes that confound by putting v1 on the same
# corpus as the other two.
#
# It matters more than it looks. v0 and v1 sit within ~0.006 of each other on
# relative contrast and ~0.003 on IVF Gini in that report -- differences far
# inside the measured noise floor. A corpus substitution is not obviously
# smaller than that, so "EMA barely moves the gate" is currently a claim about
# two runs that differ in two things.
#
# It is an instrument, not a rung: the absolute corpus path below is
# box-specific by construction, for the reason set out in
# configs/sift/v3_sift1m.yaml. The v1 rung is configs/sift/v1.yaml, and this
# file does not redefine what it reproduces.
#
# HOW TO READ THE RESULT. Against the recorded x100k_ema_only numbers, a move
# here is a corpus effect, not an EMA effect. Against v0_x100k on sift_1m, it
# is the EMA delta, measured clean for the first time. Note the seed-to-seed
# floor in docs/datasets/sift.md was measured at 30k and every floor multiple
# in the v0/v1/v4 report divides a 100k gap by it; that caveat is unchanged.
seed: 42
device: cuda:0
output_dir: runs/sift/v1_sift1m_x100k

data:
  real_path: /workspace/data-cache/sift_1m.npy
  format: npy
  metric: l2
  descriptor_dim: 128
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 128
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2

training:
  batch_size: 512
  num_gen_steps: 100000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  ema_decay: 0.999
  distance_reg_alpha: 0.0
  distance_reg_max_points: 128
  num_workers: 0
  amp: false
  log_every: 500
  eval_every: 2000
  save_every: 5000
