seed: 42
device: auto
output_dir: runs/nytimes/v1_seed42_100k
data:
  real_path: /workspace/data-cache/nytimes_250k.npy
  format: npy
  metric: angular
  descriptor_dim: 256
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true
model:
  latent_dim: 512
  generator_hidden_dims:
  - 512
  - 1024
  - 1024
  critic_hidden_dims:
  - 1024
  - 512
  - 256
  negative_slope: 0.2
  generator_type: linear_skip
  skip_dim: 256
  skip_init: orthogonal
  skip_init_gain: 1.0
training:
  batch_size: 512
  num_gen_steps: 100000
  n_critic: 3
  lr_g: 0.0001
  lr_d: 0.0001
  betas:
  - 0.0
  - 0.9
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
  select_on: gate
