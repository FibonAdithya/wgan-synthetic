# NYTimes v0, seed 42, continued to 100,000 generator steps. Identical to
# configs/nytimes/v0_seed42.yaml except:
#
#   1. output_dir     runs/nytimes/v0_seed42 -> runs/nytimes/v0_seed42_100k
#   2. num_gen_steps  30000 -> 100000
#
# Run with --resume pointed at the 30k run's checkpoint_step_30000.pt, so the
# first 30,000 steps are the committed seed-42 run itself (live weights,
# optimiser moments and best_cov all restored; EMA is off in v0). The config's
# num_gen_steps is the target total, not an additional budget. Asked for by
# the owner after the 30k run missed the gate on every statistic; this is a
# longer budget, not a new rung.
seed: 42
device: auto
output_dir: runs/nytimes/v0_seed42_100k

data:
  real_path: /workspace/data-cache/nytimes_250k.npy
  format: npy
  metric: angular
  descriptor_dim: 256
  holdout_fraction: 0.05
  synthetic_if_missing: false
  synthetic_num_vectors: 100000
  preprocess:
    center: false
    whiten: false
    l2_normalize: true

model:
  latent_dim: 256
  generator_hidden_dims: [512, 1024, 1024]
  critic_hidden_dims: [1024, 512, 256]
  negative_slope: 0.2
  generator_type: mlp

training:
  batch_size: 512
  num_gen_steps: 100000
  n_critic: 3
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.0, 0.9]
  lambda_gp: 5.0
  distance_reg_alpha: 0.0
  distance_reg_max_points: 256
  num_workers: 0
  amp: false
  log_every: 250
  eval_every: 1000
  save_every: 2000
